name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.compiler.cxx }} / ${{ matrix.config.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc-14, cxx: g++-14 }
          - { cc: clang-18, cxx: clang++-18 }
        config:
          - { name: release, build_type: Release, sanitize: "" }
          - { name: asan-ubsan, build_type: Debug, sanitize: "address,undefined" }
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.compiler.cxx }} ${{ matrix.compiler.cc }}
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}
          -DMDE_SANITIZE=${{ matrix.config.sanitize }}
          -DMDE_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4

  tsan:
    name: ThreadSanitizer / clang-18
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18
      # TSan's fixed shadow-memory layout can collide with the 32-bit mmap ASLR entropy that
      # Ubuntu 24.04 runner kernels enable ("unexpected memory mapping"); 28 bits is compatible.
      - name: Reduce mmap ASLR entropy for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMDE_SANITIZE=thread -DMDE_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4

  fuzz:
    name: libFuzzer / clang-18
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMDE_SANITIZE=address,undefined
          -DMDE_BUILD_FUZZ=ON -DMDE_BUILD_TESTS=OFF -DMDE_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Fuzz (60 s per target)
        run: |
          for target in build/fuzz/fuzz_*; do
            name=$(basename "$target")
            mkdir -p "corpus/$name"
            "$target" "corpus/$name" -max_total_time=60 -print_final_stats=1
          done
